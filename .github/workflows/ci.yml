name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript workspace
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Build workspace
        run: pnpm build
      - name: Run tests
        run: pnpm test
      - name: Check architecture dependencies
        run: pnpm architecture:check

  rust:
    name: Rust workspace
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.1 --profile default --component rustfmt --component clippy
      - name: Verify Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Build workspace
        run: cargo build --workspace
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace

  native-analysis:
    name: Native Java analysis integration
    # Full bootstrap admission is reviewed only for this exact environment.
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.1 --profile default
      - name: Build TypeScript workspace
        run: pnpm build
      - name: Build Native Analyzer
        run: cargo build --workspace
      - name: Run real-binary Java Fixtures
        run: pnpm test:native-analysis
      - name: Enforce fresh read-seal, transport and refresh-verification reservations
        if: always()
        env:
          CODEATLAS_REQUIRE_NATIVE_MEMORY_PROFILE: '1'
          CODEATLAS_REQUIRE_NATIVE_REFRESH_VERIFICATION_PROFILE: '1'
          CODEATLAS_NATIVE_MEMORY_ARTIFACT_DIR: .superpowers/native-memory/corpus
        run: node --test --test-concurrency=1 packages/runtime/test/native-metadata-corpus.test.mjs packages/providers/test/native-full-v3-memory.test.mjs packages/runtime/test/native-refresh-verification-memory.test.mjs
      - name: Collect every required memory class
        if: always()
        run: pnpm test:native-memory
      - name: Preserve memory observations including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-memory-observations
          path: .superpowers/native-memory
          if-no-files-found: error
