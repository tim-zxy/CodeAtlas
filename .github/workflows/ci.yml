name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript workspace
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check formatting
        run: pnpm format:check
      - name: Build workspace
        run: pnpm build
      - name: Run tests
        run: pnpm test
      - name: Check architecture dependencies
        run: pnpm architecture:check

  rust:
    name: Rust workspace
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.1 --profile default --component rustfmt --component clippy
      - name: Verify Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Build workspace
        run: cargo build --workspace
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace

  native-analysis:
    name: Native Java analysis integration
    # Full bootstrap admission is reviewed only for this exact environment.
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.1 --profile default
      - name: Build TypeScript workspace
        run: pnpm build
      - name: Compile Windows principal helper and run offline protocol tests
        shell: pwsh
        run: |
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -File scripts/test-windows-process-principal.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run HOST launch inventory memory checks
        shell: pwsh
        run: |
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -File scripts/test-mixed-native-host-launch-inventory.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify approved script catalog prerequisite
        id: script_catalog
        shell: pwsh
        run: |
          @'
          import assert from 'node:assert/strict';
          import { mkdir, readFile, writeFile } from 'node:fs/promises';
          import { gunzipSync } from 'node:zlib';
          import path from 'node:path';
          import { inspectRefreshCiScriptCatalog, validateRefreshCiApproval } from './scripts/helpers/native-refresh-ci-pack.mjs';
          const output = path.resolve('.superpowers/native-memory/script-catalog');
          await mkdir(output, { recursive: true });
          try {
            const approval = validateRefreshCiApproval(JSON.parse(await readFile('fixtures/ipc/refresh-v3/approved-transport-r8.json', 'utf8')));
            const entry = approval.archive.entries.find(item => item.path === 'evidence/corpus/artifacts/manifest.json');
            assert.ok(entry, 'Approved replay manifest missing');
            const manifestBytes = gunzipSync(await readFile('fixtures/ipc/refresh-v3/approved-transport-r8-manifest.json.gz'), { maxOutputLength: entry.bytes });
            const result = await inspectRefreshCiScriptCatalog({ approval, manifestBytes, repositoryPath: process.cwd() });
            await writeFile(path.join(output, 'result.json'), JSON.stringify(result, null, 2) + '\n');
            if (!result.matches) {
              console.error('R8 script catalog mismatch: Native qualification remains blocked; see script-catalog/result.json.');
              process.exitCode = 1;
            }
          } catch (error) {
            await writeFile(path.join(output, 'failure.json'), JSON.stringify({ success: false, code: 'D5_SCRIPT_PREREQUISITE_FAILED' }) + '\n');
            throw error;
          }
          '@ | node --input-type=module
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Native Analyzer
        if: steps.script_catalog.outcome == 'success'
        run: cargo build --workspace
      - name: Run real-binary Java Fixtures
        shell: pwsh
        run: |
          $env:TEMP = node -e "process.stdout.write(require('node:fs').realpathSync.native(require('node:os').tmpdir()))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TMP = $env:TEMP
          node --test --test-concurrency=1 packages/runtime/test/native-ci-context.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:native-analysis
      - name: Run Native REFRESH composition and replay contracts
        if: always() && steps.script_catalog.outcome == 'success'
        shell: pwsh
        run: |
          $env:TEMP = Join-Path $env:GITHUB_WORKSPACE '.superpowers/native-memory/refresh-regression'
          $env:TMP = $env:TEMP
          New-Item -ItemType Directory -Path $env:TEMP -Force | Out-Null
          pnpm test:native-refresh
      - name: Run Native REFRESH Storage rollback and ownership contracts
        if: always()
        run: node --test --test-concurrency=1 packages/storage/test/native-refresh-patch-store.test.mjs packages/storage/test/native-apply-sql-observation.test.mjs packages/storage/test/native-sql-lifetime-observation.test.mjs
      - name: Enforce fresh read-seal, transport and refresh-verification reservations
        if: always() && steps.script_catalog.outcome == 'success'
        env:
          CODEATLAS_REQUIRE_NATIVE_MEMORY_PROFILE: '1'
          CODEATLAS_REQUIRE_NATIVE_REFRESH_VERIFICATION_PROFILE: '1'
          CODEATLAS_NATIVE_MEMORY_ARTIFACT_DIR: .superpowers/native-memory/corpus
        run: node --test --test-concurrency=1 packages/runtime/test/native-metadata-corpus.test.mjs packages/providers/test/native-full-v3-memory.test.mjs packages/runtime/test/native-refresh-verification-memory.test.mjs
      - name: Collect every required memory class
        if: always() && steps.script_catalog.outcome == 'success'
        run: pnpm test:native-memory
      - name: Run Windows offline C# control, ownership and Entry substitutes
        if: always()
        shell: pwsh
        run: |
          node --test --test-concurrency=1 scripts/test-mixed-native-control-mailbox.mjs scripts/test-mixed-native-debug-event-bridge.mjs scripts/test-mixed-native-dynamic-host-windows.mjs scripts/test-mixed-native-dynamic-observer-loop.mjs scripts/test-mixed-native-host-startup.mjs scripts/test-mixed-native-observer-loop.mjs scripts/test-mixed-native-observer-policy.mjs scripts/test-mixed-native-dynamic-observer-policy.mjs scripts/test-mixed-native-host-protected-inventory-receiver.mjs scripts/test-mixed-process-image-identity.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -File scripts/test-mixed-native-host-consumption-lifetime.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run existing Windows Node-helper OS peak collector conformance
        if: always()
        run: node --test --test-concurrency=1 scripts/test-syntax-peak-collector.mjs
      - name: Require approved exact-pack Native REFRESH actual22
        if: always() && steps.script_catalog.outcome == 'success'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          @'
          import { mkdir, readFile, writeFile } from 'node:fs/promises';
          import path from 'node:path';
          import { downloadRefreshCiArchive } from './scripts/helpers/native-refresh-ci-pack.mjs';
          const parent = path.resolve('.superpowers/native-memory');
          await mkdir(parent, { recursive: true });
          const output = path.join(parent, 'exact-pack');
          await mkdir(output);
          try {
            const approval = JSON.parse(await readFile('fixtures/ipc/refresh-v3/approved-transport-r8.json', 'utf8'));
            await downloadRefreshCiArchive(approval, path.join(output, 'approved.zip'), process.env.GITHUB_REPOSITORY);
          } catch {
            await writeFile(path.join(output, 'download-failure.json'), JSON.stringify({ success: false, code: 'D5_PINNED_ASSET_FAILED' }) + '\n', { flag: 'wx' });
            process.exitCode = 1;
          }
          '@ | node --input-type=module
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-concurrency=1 packages/runtime/test/native-actual-diagnostic.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CODEATLAS_ACTUAL_DIAGNOSTIC_DIR = Join-Path $env:GITHUB_WORKSPACE '.superpowers/native-memory/actual-diagnostic'
          New-Item -ItemType Directory -Path $env:CODEATLAS_ACTUAL_DIAGNOSTIC_DIR -ErrorAction Stop | Out-Null
          $diagnosticImport = node --input-type=module -e "process.stdout.write(new URL('./packages/runtime/test/fixtures/native-actual-diagnostic.mjs', import.meta.url).href)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $previousNodeOptions = $env:NODE_OPTIONS
          $approvalPath = Join-Path $env:GITHUB_WORKSPACE 'fixtures/ipc/refresh-v3/approved-transport.json'
          $r8ApprovalPath = Join-Path $env:GITHUB_WORKSPACE 'fixtures/ipc/refresh-v3/approved-transport-r8.json'
          $historicalApproval = [IO.File]::ReadAllBytes($approvalPath)
          try {
            Copy-Item -LiteralPath $r8ApprovalPath -Destination $approvalPath -ErrorAction Stop
            $env:NODE_OPTIONS = "$previousNodeOptions --import=$diagnosticImport".Trim()
            node scripts/native-refresh-ci.mjs collect .superpowers/native-memory/exact-pack/approved.zip .superpowers/native-memory/exact-pack/acceptance
            $collectExitCode = $LASTEXITCODE
          } finally {
            [IO.File]::WriteAllBytes($approvalPath, $historicalApproval)
            if ((Get-FileHash -LiteralPath $approvalPath).Hash -ne [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($historicalApproval))) {
              throw 'Historical approval restoration hash mismatch'
            }
            $env:NODE_OPTIONS = $previousNodeOptions
            Remove-Item Env:CODEATLAS_ACTUAL_DIAGNOSTIC_DIR
          }
          exit $collectExitCode
      - name: Preserve memory observations including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-memory-observations
          path: .superpowers/native-memory
          if-no-files-found: error
      - name: Preserve original fixed-volume REFRESH scratch on export failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-refresh-original-fallback
          path: |
            C:/CodeAtlas-P05-D5/evidence/corpus/replay
            C:/CodeAtlas-P05-D5-R2/evidence/corpus/replay
            C:/CodeAtlas-P05-D5-R3/evidence/corpus/replay
            C:/CodeAtlas-P05-D5-R4/evidence/corpus/replay
            C:/CodeAtlas-P05-D5-R5/evidence/corpus/replay
            C:/CodeAtlas-P05-D5-R8/evidence/corpus/replay
          # Absent before acquisition is expected; the required actual step still fails.
          if-no-files-found: ignore
